<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A" />
      <stop offset="50%" stop-color="#07111F" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#60A5FA" />
      <stop offset="50%" stop-color="#3B82F6" />
      <stop offset="100%" stop-color="#1D4ED8" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34D399" />
      <stop offset="100%" stop-color="#10B981" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" />
  <rect width="510" height="510" x="1" y="1" rx="111" fill="none" stroke="#3B82F6" stroke-width="2" stroke-opacity="0.3" />

  <!-- Shield Element -->
  <g transform="translate(0, -10)">
    <!-- Shield Shadow / Glow -->
    <path d="M256 90 L380 135 C380 255 256 345 256 345 C256 345 132 255 132 135 Z" fill="#3B82F6" opacity="0.25" filter="url(#glow)" />
    
    <!-- Shield Main Body -->
    <path d="M256 90 L380 135 C380 255 256 345 256 345 C256 345 132 255 132 135 Z" fill="url(#shieldGrad)" />
    
    <!-- Shield Inner Bevel Light -->
    <path d="M256 95 L372 138 C372 245 256 332 256 332 C256 332 140 245 140 138 Z" fill="none" stroke="#93C5FD" stroke-width="3" stroke-opacity="0.6" />
    <path d="M256 95 L256 332" stroke="#FFFFFF" stroke-width="2" stroke-opacity="0.3" />

    <!-- Car Symbol inside Shield -->
    <g fill="#FFFFFF">
      <path d="M200 230 C200 220 208 212 218 212 L294 212 C304 212 312 220 312 230 L320 255 C326 257 330 262 330 268 L330 290 C330 294 326 298 322 298 L318 298 L318 308 C318 313 313 317 308 317 L298 317 C293 317 289 313 289 308 L289 298 L223 298 L223 308 C223 313 219 317 214 317 L204 317 C199 317 195 313 195 308 L195 298 L190 298 C185 298 182 294 182 290 L182 268 C182 262 186 257 192 255 Z" />
      <!-- Windshield cutout -->
      <path d="M214 225 L298 225 L306 250 L206 250 Z" fill="#1D4ED8" />
      <!-- Headlights -->
      <circle cx="204" cy="275" r="7" fill="#FBBF24" />
      <circle cx="308" cy="275" r="7" fill="#FBBF24" />
    </g>

    <!-- Verification Checkmark Badge -->
    <circle cx="360" cy="140" r="32" fill="#07111F" stroke="#22C55E" stroke-width="4" />
    <circle cx="360" cy="140" r="26" fill="url(#accentGrad)" />
    <path d="M348 140 L356 148 L373 131" fill="none" stroke="#FFFFFF" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" />
  </g>

  <!-- Typography: AUTOCHECK BRASIL -->
  <text x="256" y="396" text-anchor="middle" font-family="'Plus Jakarta Sans', system-ui, -apple-system, sans-serif" font-weight="800" font-size="34" fill="#F8FAFC" letter-spacing="2">AUTOCHECK</text>
  <text x="256" y="432" text-anchor="middle" font-family="'Plus Jakarta Sans', system-ui, -apple-system, sans-serif" font-weight="700" font-size="18" fill="#3B82F6" letter-spacing="6">BRASIL</text>
</svg>
